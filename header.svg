<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 230" width="850" height="230" role="img" aria-label="Maite Doin - firmware, saas, computer vision, ai - building systems that prefer to be wrong safely">
<title>Maite Doin - doinlabs.com.br</title>
<defs>
<style>
@keyframes wipe1 { from { transform: translateX(-250px) } to { transform: translateX(0) } }
@keyframes wipe2 { from { transform: translateX(-260px) } to { transform: translateX(0) } }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
@keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
@keyframes pulse { 0%,100% { opacity: .2 } 50% { opacity: 1 } }
@keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
@keyframes sweep { 0% { transform: translateX(0); opacity: 0 } 8% { opacity: .6 } 92% { opacity: .6 } 100% { transform: translateX(844px); opacity: 0 } }
@keyframes trace { from { stroke-dashoffset: 420 } to { stroke-dashoffset: 0 } }
@keyframes flow { from { stroke-dashoffset: 0 } to { stroke-dashoffset: -44px } }
@keyframes glitch { 0%,86%,100% { transform: translate(0,0) } 88% { transform: translate(5px,-3px) } 91% { transform: translate(-4px,2px) } 94% { transform: translate(3px,1px) } }
.w1 { animation: wipe1 1.05s steps(8, end) both }
.w2 { animation: wipe2 .95s steps(8, end) .95s both }
.glitch { animation: glitch 5.5s ease-in-out 2s infinite }
.caret { animation: blink 1s step-end 1.9s infinite }
.f1 { animation: fade .5s ease-out 1.35s both }
.f2 { animation: fade .5s ease-out 1.85s both }
.dot { animation: pulse 1.5s ease-in-out 1.8s infinite }
.r1 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 2.05s both }
.r2 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 2.25s both }
.r3 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 2.45s both }
.r4 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 2.65s both }
.r5 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 2.85s both }
.r6 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 3.05s both }
.r7 { animation: rise .55s cubic-bezier(.2,.8,.2,1) 3.25s both }
.bar { transform-origin: left center; animation: grow 1s cubic-bezier(.2,.8,.2,1) both }
.bar1 { animation-delay: 2.15s } .bar2 { animation-delay: 2.35s }
.bar3 { animation-delay: 2.55s } .bar4 { animation-delay: 2.75s }
.scan { animation: sweep 7s linear 1.2s infinite }
.ecg { animation: trace 2.4s ease-out 2.4s both }
.rail { animation: flow 3s linear 2.1s infinite }
.tex { animation: fade .9s ease-out 2.4s both }
</style>

<pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
<circle cx="1.8" cy="1.8" r="1.5" fill="#e8558f" fill-opacity=".5"></circle>
</pattern>
<pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
<line x1="0" y1="0" x2="0" y2="9" stroke="#e8558f" stroke-opacity=".4" stroke-width="1.8"></line>
</pattern>
<clipPath id="c1"><rect class="w1" x="22" y="56" width="252" height="70"></rect></clipPath>
<clipPath id="c2"><rect class="w2" x="22" y="126" width="262" height="72"></rect></clipPath>
