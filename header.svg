<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="#e8558f" x="27" y="110" font-size="58" font-weight="900" letter-spacing="-1">MAITÊ</text>
</g>
<g clip-path="url(#c2)">
<text font-family="system-ui, -apple-system, Segoe UI, sans-serif" fill="none" stroke="#e8558f" stroke-width="1.6" x="27" y="176" font-size="58" font-weight="900" letter-spacing="8">DOIN</text>
</g>
<rect class="caret" x="222" y="138" width="15" height="44" fill="#ff7ab6"></rect>

<g class="r1">
<line class="rail" x1="300" y1="66" x2="560" y2="66" stroke="#e8558f" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="6 5"></line>
</g>
<text class="r2" font-family="monospace" x="300" y="92" font-size="13.5" font-weight="700" letter-spacing="1.2"><tspan fill="#e8558f">firmware</tspan><tspan fill="#78818c"> · </tspan><tspan fill="#e8558f">saas</tspan></text>
<text class="r3" font-family="monospace" x="300" y="112" font-size="13.5" font-weight="700" letter-spacing="1.2"><tspan fill="#e8558f">computer vision</tspan><tspan fill="#78818c"> · </tspan><tspan fill="#e8558f">ai</tspan></text>

<g class="r5">
